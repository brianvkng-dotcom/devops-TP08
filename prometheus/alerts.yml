groups:
  - name: devops-tp08
    rules:

      - alert: AppDown
        expr: up{job="flask-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aplicación caída"
          description: "El backend Flask no está disponible."

      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta"
          description: "El uso de CPU supera el 80% durante 5 minutos."

      - alert: HighErrorRate
        expr: sum(rate(app_requests_total{status=~"5.."}[5m])) / sum(rate(app_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de errores 5xx alta"
          description: "Más del 5% de las requests están devolviendo errores 5xx."

      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Poco espacio en disco"
          description: "Queda menos del 10% de espacio disponible."
